# Tareas programadas: el ranking diario se calcula aquí, en Node, y se guarda en Supabase.
# No va en el worker porque el plan gratis de Cloudflare corta cada petición a los 10 ms de CPU.
name: Tareas programadas
on:
  schedule:
    - cron: "0 22 * * *"   # ranking diario, 5 pm Colombia
  workflow_dispatch:
jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
      MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      MARKET_TZ: ${{ secrets.MARKET_TZ }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import ./scripts/alias.mjs scripts/ranking.mjs
